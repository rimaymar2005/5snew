  function editorChecklist(ed) {
    const enUso = !ed.nuevo && ed.auditorias > 0;
    const c = { codigo: ed.codigo, nombre: ed.nombre, formato: ed.formato || '', escala: ed.escala === 5 ? 5 : null, umbrales: ed.umbrales.slice(), puntos: ed.puntos.map((p) => ({ n: p.n, s: p.s, q: p.q, p: p.p })) };
    const raizEd = h('div', { class: 'stack' });
    const errores = h('div', {});
    const sumaEl = h('span', { class: 'badge mute' });
    const sumaTxt = () => {
      const s = c.puntos.reduce((x, p) => x + (Number(p.p) || 0), 0);
      if (c.escala === 5) { sumaEl.textContent = `Escala 0–5 · ${c.puntos.length} preguntas · máximo ${s}`; sumaEl.className = 'badge ok'; return; }
      sumaEl.textContent = s === 100 ? 'Suma 100 / 100' : s < 100 ? `Suma ${s} / 100 · faltan ${100 - s}` : `Suma ${s} / 100 · sobran ${s - 100}`;
      sumaEl.className = `badge ${s === 100 ? 'ok' : 'bad'}`;
    };
    const pintaPuntos = h('div', { class: 'stack' });
    function pintarPuntos() {
      pintaPuntos.replaceChildren();
      let n = 0;
      for (const s of ORDEN_S) {
        const idxs = c.puntos.map((p, i) => [p, i]).filter(([p]) => p.s === s);
        const sub = h('span', { class: 'muted small' });
        const subtotal = () => { sub.textContent = `${idxs.reduce((x, [p]) => x + (Number(p.p) || 0), 0)} puntos · ${idxs.length} pregunta(s)`; };
        subtotal();
        pintaPuntos.append(h('div', { class: 'sec-title' }, h('h3', {}, s), sub));
        for (const [p, i] of idxs) {
          n += 1;
          pintaPuntos.append(h('div', { class: 'item', style: 'padding:12px' }, h('div', { class: 'q' }, h('span', { class: 'n' }, n),
            h('div', { class: 'stack-s', style: 'flex:1' },
              h('textarea', { class: 'in', rows: '2', maxlength: '2000', 'aria-label': `Pregunta ${n}`, placeholder: 'Texto de la pregunta', oninput: (e) => { p.q = e.target.value; } }, p.q),
              h('div', { class: 'row' },
                h('label', { class: 'f', style: 'grid-auto-flow:column;align-items:center' }, 'Valor',
                  h('input', { class: 'in', type: 'number', min: '1', max: '100', step: '1', value: String(p.p), style: 'width:90px', 'aria-label': `Valor de la pregunta ${n}`,
                    oninput: (e) => { p.p = e.target.value === '' ? 0 : Number(e.target.value); sumaTxt(); subtotal(); } })),
                enUso ? null : h('button', { class: 'btn sm danger', type: 'button', onclick: () => { c.puntos.splice(i, 1); pintarPuntos(); sumaTxt(); } }, 'Quitar'))))));
        }
        if (!enUso) pintaPuntos.append(h('div', { class: 'row' }, h('button', { class: 'btn sm', type: 'button', onclick: () => { c.puntos.push({ s, q: '', p: c.escala === 5 ? 5 : 1 }); pintarPuntos(); sumaTxt(); } }, `Agregar pregunta a ${s}`)));
      }
    }
    // pegar varias preguntas de golpe
    const pegar = h('textarea', { class: 'in', rows: '4', 'aria-label': 'Preguntas para pegar, una por línea', placeholder: 'Pega aquí varias preguntas, una por línea' });
    const pegarS = h('select', { class: 'in', 'aria-label': 'S de las preguntas pegadas' }, ORDEN_S.map((s) => h('option', { value: s }, s)));
    const pegarV = h('input', { class: 'in', type: 'number', min: '1', max: '100', value: '5', 'aria-label': 'Valor de cada pregunta pegada' });

    const nombre = h('input', { class: 'in', type: 'text', value: c.nombre, maxlength: '200', 'aria-label': 'Nombre del checklist', oninput: (e) => { c.nombre = e.target.value; } });
    const codigo = h('input', { class: 'in', type: 'text', value: c.codigo, maxlength: '20', disabled: !ed.nuevo, placeholder: 'Ej. CL-13', 'aria-label': 'Código del checklist', oninput: (e) => { c.codigo = e.target.value; } });
    const formato = h('input', { class: 'in', type: 'text', value: c.formato, maxlength: '200', 'aria-label': 'Formato del checklist', oninput: (e) => { c.formato = e.target.value; } });
    const umb = [0, 1, 2, 3].map((i) => h('label', { class: 'f' }, `Desde ${i + 2}S`, h('input', { class: 'in', type: 'number', min: '1', max: '100', step: '1', value: String(c.umbrales[i]), disabled: enUso,
      oninput: (e) => { c.umbrales[i] = Number(e.target.value); } })));

    async function guardar() {
      const cuerpo = { codigo: c.codigo, nombre: c.nombre, formato: c.formato, escala: c.escala, umbrales: c.umbrales, puntos: c.puntos.map((p) => (enUso ? { n: p.n, s: p.s, q: p.q, p: Number(p.p) } : { s: p.s, q: p.q, p: Number(p.p) })) };
      try {
        if (ed.nuevo) await api('POST', '/api/checklists', cuerpo); else await api('PUT', `/api/checklists/${encodeURIComponent(ed.codigo)}`, cuerpo);
        S.adminMsg = `Checklist ${c.codigo} guardado.`; S.adminEd = null; render();
      } catch (e) { errorEn(errores, e); window.scrollTo(0, 0); }
    }

    raizEd.append(
      h('div', { class: 'row between' }, h('h2', {}, ed.nuevo ? 'Nuevo checklist' : `Editar ${ed.codigo}`), h('button', { class: 'btn', type: 'button', onclick: () => { S.adminEd = null; render(); } }, 'Cancelar')),
      enUso ? h('div', { class: 'notice warn' }, `Este checklist ya se usó en ${ed.auditorias} auditoría(s). Puedes corregir el nombre, el formato y el texto de las preguntas; no se pueden agregar ni quitar preguntas ni cambiar sus valores o umbrales (alterarían las calificaciones ya capturadas). Para eso, hazlo en un ciclo nuevo.`) : null,
      errores,
      h('section', { class: 'card stack' },
        h('div', { class: 'rep-grid' }, h('label', { class: 'f' }, 'Código', codigo), h('label', { class: 'f' }, 'Nombre', nombre), h('label', { class: 'f' }, 'Formato', formato),
          h('label', { class: 'f' }, 'Escala', h('span', { class: 'row', style: 'gap:8px' }, h('input', { type: 'checkbox', checked: c.escala === 5, disabled: enUso, 'aria-label': 'Preguntas de 0 a 5',
            onchange: (e) => { c.escala = e.target.checked ? 5 : null; if (c.escala) c.puntos.forEach((p) => { p.p = 5; }); pintarPuntos(); sumaTxt(); } }), 'Preguntas de 0 a 5'))),
        h('div', { class: 'rep-grid' }, umb),
        h('p', { class: 'muted small' }, 'Umbrales: calificación mínima para cada nivel. Menos que "Desde 2S" es 1S.')),
      h('div', { class: 'row between' }, h('h2', {}, 'Preguntas'), sumaEl),
      pintaPuntos,
      enUso ? null : h('section', { class: 'card stack' }, h('h3', {}, 'Agregar varias preguntas de golpe'),
        h('div', { class: 'rep-grid' }, h('label', { class: 'f' }, 'S', pegarS), h('label', { class: 'f' }, 'Valor de cada una', pegarV)),
        h('label', { class: 'f' }, 'Preguntas (una por línea)', pegar),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => {
          const ls = pegar.value.split('\n').map((l) => l.trim()).filter(Boolean);
          ls.forEach((q) => c.puntos.push({ s: pegarS.value, q, p: c.escala === 5 ? 5 : (Number(pegarV.value) || 1) }));
          pegar.value = ''; pintarPuntos(); sumaTxt();
        } }, 'Agregar a la lista'))),
      h('div', { class: 'footer-act' }, h('span', { class: 'muted small' }, 'Los valores de todas las preguntas deben sumar exactamente 100.'),
        h('button', { class: 'btn primary', type: 'button', onclick: guardar }, 'Guardar checklist')));
    pintarPuntos(); sumaTxt();
    return raizEd;
  }

  // ================== Ciclo y rotación ==================
  function panelCiclo() {
    const c = S.cfg;
    const cont = h('div', { class: 'stack' });
    const msgPar = h('div', {});
    const nombre = h('input', { class: 'in', type: 'text', value: R.parametros.nombre, maxlength: '120', 'aria-label': 'Nombre del programa' });
    const dias = h('input', { class: 'in', type: 'number', min: '1', max: '30', value: String(R.parametros.dias), 'aria-label': 'Días para completar cada auditoría' });
    cont.append(h('section', { class: 'card stack' }, h('h2', {}, 'Parámetros'),
      h('div', { class: 'rep-grid' }, h('label', { class: 'f' }, 'Nombre del programa', nombre), h('label', { class: 'f' }, 'Días para completar cada auditoría (fecha límite = inicio de semana + días)', dias)),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: async () => {
        try { await api('PUT', '/api/parametros', { nombre: nombre.value, dias: Number(dias.value) }); ok('Parámetros guardados.'); await recargarPanel(); } catch (e) { errorEn(msgPar, e); }
      } }, 'Guardar parámetros')), msgPar));

    // fecha de inicio
    const fin = h('input', { class: 'in', type: 'date', value: c.inicio, 'aria-label': 'Nueva fecha de inicio del ciclo' });
    const nota = h('p', { class: 'muted small' });
    const msgInicio = h('div', {});
    const pintaNota = () => {
      if (Number.isNaN(parseYMD(fin.value))) { nota.textContent = 'Elige una fecha válida.'; return; }
      const total = c.rotacion.length;
      const lunes = new Date(parseYMD(fin.value)).getUTCDay() === 1;
      nota.textContent = `La semana 1 comenzaría el ${fmtFecha(fin.value)}${total ? ` y la última (${total}) vencería el ${fmtFecha(addDays(fin.value, (total - 1) * 7 + c.dias))}` : ''}.${lunes ? '' : ' Aviso: esa fecha no es lunes; las semanas se cuentan de 7 en 7 días desde ella.'}`;
    };
    fin.addEventListener('input', pintaNota);
    pintaNota();
    async function cambiarInicio(confirmado) {
      try {
        const r = await api('PUT', `/api/config/inicio${confirmado ? '?confirmar=1' : ''}`, { inicio: fin.value });
        S.adminMsg = r.sinCambios ? 'La fecha de inicio ya era esa; no hubo cambios.' : `Inicio del ciclo cambiado a ${fmtFecha(r.inicio)}. ${r.auditorias ? `Se conservaron ${r.auditorias} auditorías capturadas.` : ''}`;
        await traer(); render();
      } catch (e) {
        if (e.status === 409 && e.json && e.json.codigo === 'confirmar_inicio') {
          if (await confirmar('Cambiar la fecha de inicio', e.message, 'Cambiar fecha de inicio')) cambiarInicio(true);
          return;
        }
        errorEn(msgInicio, e);
      }
    }
    cont.append(h('section', { class: 'card stack' }, h('h2', {}, 'Fecha de inicio del ciclo'),
      h('p', { class: 'muted small' }, `Hoy el ciclo inicia el ${fmtFecha(c.inicio)}. Cambiarla recorre las fechas de todas las semanas y sus fechas límite sin tocar la rotación ni los checklists.`),
      h('label', { class: 'f' }, 'Nueva fecha de inicio (semana 1)', fin), nota,
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => cambiarInicio(false) }, 'Cambiar fecha de inicio')), msgInicio));

    // rotación
    const rot = R.rotacion;
    const msgRot = h('div', {});
    const semSel = Math.min(Math.max(S.adminSem || 1, 1), Math.max(c.rotacion.length, 1));
    const detalle = h('div', {});
    const pintaSemana = (w) => {
      S.adminSem = w;
      const fila = c.rotacion[w - 1] || [];
      detalle.replaceChildren(h('div', { class: 'tbl-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Área auditora'), h('th', {}, 'Audita a'), h('th', {}, 'Checklist'))),
        h('tbody', {}, c.areas.map((a, i) => (fila[i] === null || fila[i] === undefined ? null : h('tr', {},
          h('td', {}, h('strong', {}, a.id), ' ', a.nombre), h('td', {}, h('strong', {}, c.areas[fila[i]].id), ' ', c.areas[fila[i]].nombre), h('td', {}, c.areas[fila[i]].checklist)))).filter(Boolean)))));
    };
    async function regenerar(completa) {
      const txt = completa ? 'Se rehará TODA la rotación desde cero. Solo es posible mientras no haya auditorías capturadas.'
        : 'Se recalculan solo las semanas que aún no inician, sin repetir parejas ya usadas. Las semanas que ya comenzaron no cambian.';
      if (!(await confirmar(completa ? 'Rehacer toda la rotación' : 'Recalcular rotación futura', txt, 'Continuar'))) return;
      try { const r = await api('POST', '/api/rotacion/regenerar', { completa }); ok(r.nota); await recargarPanel(); } catch (e) { errorEn(msgRot, e); }
    }
    cont.append(h('section', { class: 'card stack' }, h('h2', {}, 'Rotación'),
      h('p', { class: 'muted' }, rot.semanas ? `${rot.semanas} semanas para ${rot.activas} áreas activas. Se genera sola: nadie se audita a sí misma, cada área recibe una sola auditora por semana y ninguna pareja se repite.`
        : 'Todavía no hay rotación: se genera sola en cuanto hay al menos 2 áreas activas.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', onclick: () => regenerar(false) }, 'Recalcular rotación futura'),
        h('button', { class: 'btn danger', type: 'button', disabled: R.auditorias > 0, onclick: () => regenerar(true) }, 'Rehacer toda la rotación')),
      R.auditorias > 0 ? h('p', { class: 'muted small' }, `"Rehacer toda" está deshabilitado porque ya hay ${R.auditorias} auditoría(s) capturadas.`) : null,
      msgRot,
      rot.semanas ? h('label', { class: 'f' }, 'Ver una semana', h('select', { class: 'in', 'aria-label': 'Semana de la rotación', onchange: (e) => pintaSemana(+e.target.value) },
        Array.from({ length: rot.semanas }, (_, i) => i + 1).map((w) => h('option', { value: w, selected: w === semSel }, `Semana ${w} · ${fmtFecha(inicioSemana(c.inicio, w))}`)))) : null,
      detalle));
    if (rot.semanas) pintaSemana(semSel);
    return cont;
  }

  // ================== Tiempos de captura (solo administrador) ==================
  const fmtDur = (s) => { if (s === null || s === undefined) return '—'; const h2 = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); return h2 ? `${h2}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`; };
  function panelTiempos() {
    const cont = h('div', { class: 'stack' }, h('p', { class: 'muted' }, 'Cargando…'));
    const ctlP = crearControlPeriodo((n) => { S.admP = n; ctlP.actualizar(n, S.opsP); cargarT(); });
    ctlP.actualizar(S.admP || { periodo: 'ciclo', valor: '' }, S.opsP);
    function cargarT() {
    const P = S.admP || { periodo: 'ciclo', valor: '' };
    api('GET', `/api/admin/tiempos${qsPeriodo(P)}`).then((d) => {
      S.opsP = d.opciones; ctlP.actualizar({ periodo: d.periodo, valor: d.valor }, d.opciones);
      const r = d.resumen;
      const tile = (v, l) => h('div', { class: 'kpi' }, h('div', { class: 'v' }, v), h('div', { class: 'l' }, l));
      cont.replaceChildren(
        h('div', { class: 'notice' }, 'El tiempo de captura es un dato exclusivo del administrador: ni las áreas que auditan ni las auditadas lo ven, y no sale en el CSV. Mide solo actividad real (las pausas largas no cuentan).'),
        ctlP.el,
        h('p', { class: 'muted small' }, etiquetaPeriodo(d.periodo, d.valor, d.opciones)),
        h('div', { class: 'kpis' }, tile(fmtDur(r.promedio_seg), 'Tiempo promedio (min:seg)'), tile(fmtDur(r.mediana_seg), 'Mediana'), tile(fmtDur(r.minimo_seg), 'Más rápida'), tile(fmtDur(r.maximo_seg), 'Más lenta'),
          tile(`${r.con_tiempo} de ${r.auditorias}`, 'Auditorías con tiempo medido')),
        h('h2', {}, 'Promedio por área que audita'),
        d.por_area.length ? h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Área'), h('th', { class: 'r' }, 'Auditorías'), h('th', { class: 'r' }, 'Tiempo promedio'))),
          h('tbody', {}, d.por_area.map((a) => h('tr', {}, h('td', {}, h('strong', {}, a.id), ' ', a.nombre), h('td', { class: 'r' }, a.auditorias), h('td', { class: 'r' }, fmtDur(a.promedio_seg))))))) : h('p', { class: 'muted' }, 'Sin tiempos medidos en este periodo.'),
        h('h2', {}, 'Auditorías finalizadas'),
        d.auditorias.length ? h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['ID', 'Audita', 'Auditada', 'Persona que audita', 'Finalizada', 'Tiempo'].map((x, k) => h('th', { class: k === 5 ? 'r' : '' }, x)))),
          h('tbody', {}, d.auditorias.map((a) => h('tr', {}, h('td', {}, a.id), h('td', {}, a.auditora_nombre), h('td', {}, a.auditada_nombre), h('td', {}, a.persona_audita || ''), h('td', {}, a.terminado ? fmtHora(a.terminado) : ''), h('td', { class: 'r' }, fmtDur(a.duracion_seg))))))) : h('p', { class: 'muted' }, 'No hay auditorías finalizadas en este periodo.'));
    }).catch((e) => errorEn(cont, e));
    }
    cargarT();
    return cont;
  }

  // ================== Servidor ==================
  function panelServidor() {
    const cont = h('div', { class: 'stack' });
    const bit = h('div', {});
    cont.append(h('section', { class: 'card stack' }, h('h2', {}, 'Respaldo y bitácora'),
      h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', onclick: async () => {
          try { descargar(`respaldo_5s_${hoyLocal()}.sql`, await api('GET', '/api/respaldo', undefined, { blob: true })); toast('Respaldo descargado.'); } catch (e) { toast(e.message, 'bad'); }
        } }, 'Descargar respaldo de la base (.sql)'),
        h('button', { class: 'btn', type: 'button', onclick: async () => {
          try {
            const l = await api('GET', '/api/bitacora?limit=60');
            bit.replaceChildren(h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Fecha'), h('th', {}, 'Quién'), h('th', {}, 'Acción'), h('th', {}, 'Detalle'))),
              h('tbody', {}, l.map((x) => h('tr', {}, h('td', {}, fmtHora(x.ts)), h('td', {}, x.quien), h('td', {}, x.accion), h('td', {}, x.detalle || '')))))));
          } catch (e) { toast(e.message, 'bad'); }
        } }, 'Ver bitácora')), bit));

    // importación: ya no es necesaria; queda como herramienta avanzada (migrar de otro servidor o restaurar un archivo)
    const resultado = h('div', {});
    const archivo = h('input', { type: 'file', accept: 'application/json,.json', class: 'in', 'aria-label': 'Archivo de configuración JSON' });
    async function importar(nuevoCiclo) {
      const f = archivo.files && archivo.files[0];
      if (!f) { resultado.replaceChildren(h('div', { class: 'notice bad' }, 'Elige primero un archivo de configuración.')); return; }
      let cfg;
      try { cfg = JSON.parse(await f.text()); } catch (e) { resultado.replaceChildren(h('div', { class: 'notice bad' }, 'El archivo no es un JSON válido.')); return; }
      try {
        const r = await api('PUT', `/api/config${nuevoCiclo ? '?nuevo_ciclo=1' : ''}`, cfg);
        S.adminMsg = `Configuración importada: ${r.areas} áreas, ${r.checklists} checklists, ${r.semanas} semanas, inicio ${fmtFecha(r.inicio)}.`;
        await traer(); render();
      } catch (e) {
        if (e.status === 409 && e.json && e.json.codigo === 'ciclo_nuevo') { if (await confirmar('Iniciar un ciclo nuevo', e.message, 'Archivar y continuar')) importar(true); return; }
        errorEn(resultado, e);
      }
    }
    cont.append(h('details', { class: 'card' }, h('summary', {}, 'Avanzado: importar una configuración completa desde un archivo'),
      h('div', { class: 'stack', style: 'margin-top:16px' },
        h('p', { class: 'muted small' }, 'No es necesario para usar la app. Reemplaza las áreas, checklists y rotación con los de un archivo JSON (formato a5s-config-1).'),
        h('label', { class: 'f' }, 'Archivo', archivo),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => importar(false) }, 'Importar configuración')), resultado)));
    return cont;
  }

  function pintar() {
    panel.replaceChildren(S.adminTab === 'areas' ? panelAreas() : S.adminTab === 'checklists' ? panelChecklists() : S.adminTab === 'ciclo' ? panelCiclo() : S.adminTab === 'tiempos' ? panelTiempos() : panelServidor());
  }
  recargarPanel();
  return raiz;
}

/* =====================================================================
   Arranque
   ===================================================================== */
function init() {
  S.device = kv.get('a5s.dev') || `dev-${Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => pad(b.toString(16))).join('')}`;
  kv.set('a5s.dev', S.device);
  const venia = kv.migrarLegado(); // equipos que ya usaban la app (solo existía FC)
  const guardada = kv.get('a5s.planta');
  S.planta = PLANTAS.some((p) => p.id === guardada) ? guardada : (PLANTAS.length === 1 ? PLANTAS[0].id : (venia ? 'fc' : null));
  if (S.planta) kv.set('a5s.planta', S.planta);
  cargarPlanta();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (!location.hash || location.hash === '#/') history.replaceState(null, '', S.planta ? inicioDe() : '#/planta');
  render();
  if (S.token) sync();
  setInterval(() => { if (!document.hidden && (S.token || gembaPorEnviar().length)) sync(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.token || gembaPorEnviar().length)) sync(); });
}
init();
})();
</script>
</body>
</html>
