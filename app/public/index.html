<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e2001a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Auditorías 5S">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Auditorías 5S</title>
<style nonce="__NONCE__">
/* Tokens del diseño de referencia: rojo corporativo, azul secundario, ámbar, superficies frías, Inter + mono */
:root {
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 11px; --t-sm: 13px; --t-md: 14px; --t-lg: 18px; --t-xl: 24px; --t-2xl: 40px;
  --r: 16px; --r-ctl: 8px; --r-pill: 12px;
  --bg: #f8f9ff; --surface: #ffffff; --surface-2: #ebeef6; --surface-3: #f1f3fc; --surface-4: #e5e8f0;
  --line: #e5e8f0; --line-strong: #cdd2dc;
  --text: #181c22; --muted: #5e3f3b; --faint: #936e6a; --btn-text: #181c22;
  --accent: #e2001a; --accent-strong: #b40012; --accent-hover: #b40012; --accent-ink: #ffffff; --accent-soft: #ffdad6;
  --ok: #059669; --ok-text: #065f46; --ok-soft: #d1fae5; --on-ok: #ffffff;
  --warn: #e69500; --warn-text: #7c4d00; --warn-soft: #ffddb8; --on-warn: #2a1700;
  --bad: #ba1a1a; --bad-soft: #ffdad6; --on-bad: #ffffff;
  --audit: #005fae; --audit-soft: #d4e3ff; --s1: #005fae; --s2: #c2185b;
  --inverse: #2d3137; --inverse-ink: #eef1f9; --glass: rgba(255, 255, 255, .82);
  --shadow: 0 1px 2px rgba(24, 28, 34, .06), 0 1px 3px rgba(24, 28, 34, .05);
  --shadow-modal: 0 20px 25px -5px rgba(24, 28, 34, .14), 0 8px 10px -6px rgba(24, 28, 34, .1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 var(--t-md)/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: var(--t-xl); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
h2 { font-size: var(--t-lg); font-weight: 600; line-height: 1.3; }
h3 { font-size: var(--t-md); font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: var(--t-sm); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- estructura ---------- */
.shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.top {
  position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: center; gap: 16px; min-height: 60px;
}
.brand { font-weight: 700; font-size: var(--t-lg); letter-spacing: .02em; color: var(--accent); }
.brand small { font-weight: 600; color: var(--muted); font-size: var(--t-xs); letter-spacing: 0; display: block; margin-top: 2px; }
.top .spacer { flex: 1; }
.chip-area {
  min-height: 48px; max-width: 46vw; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface-2);
  color: var(--text); font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.chip-area span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { min-height: 48px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font: inherit; font-size: var(--t-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
.pill.pend .dot { background: var(--warn); }
.pill.off .dot { background: var(--bad); }
.pill.busy .dot { animation: pulso 1s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .25; } }
main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
.nav {
  position: sticky; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding: 0 8px env(safe-area-inset-bottom);
}
.nav a {
  flex: 1; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--muted); text-decoration: none; font-size: var(--t-xs); font-weight: 650;
}
.nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a[aria-current="page"] { color: var(--accent); }
@media (min-width: 900px) {
  .shell { grid-template-columns: 190px 1fr; grid-template-rows: auto 1fr; }
  .top { grid-column: 1 / -1; }
  .nav { grid-column: 1; grid-row: 2; position: sticky; top: 76px; align-self: start; flex-direction: column; border-top: 0; border-right: 1px solid var(--line); height: calc(100vh - 76px); padding: 16px 8px; gap: 8px; background: transparent; }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; min-height: 52px; border-radius: 10px; font-size: var(--t-md); }
  .nav a[aria-current="page"] { background: var(--accent-soft); }
  main { grid-column: 2; grid-row: 2; }
  .shell.solo { grid-template-columns: 1fr; }
  .shell.solo main { grid-column: 1; }
}

/* ---------- componentes ---------- */
.stack { display: grid; gap: 24px; }
.stack-s { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.row.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; background: var(--surface-2); }
.page-title { display: grid; gap: 8px; margin: 8px 0; }
.btn {
  min-height: 48px; padding: 0 20px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); color: var(--btn-text);
  font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); transform: translateY(-1px); box-shadow: var(--shadow-modal); }
.btn.primary:active { transform: none; box-shadow: none; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-strong); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.sm { min-height: 48px; padding: 0 14px; font-size: var(--t-sm); }
div.f { display: grid; gap: 12px; align-content: start; font-size: var(--t-sm); }
label.f { display: grid; gap: 8px; font-weight: 500; font-size: var(--t-sm); color: var(--muted); }
.in, select.in, textarea.in {
  min-height: 48px; width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 16px; /* 16 px evita el zoom automático de iOS al enfocar un campo */
}
.in::placeholder { color: var(--faint); }
textarea.in { min-height: 76px; resize: vertical; }
.in:focus { border-color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: var(--r-ctl); font-size: var(--t-xs); font-weight: 500; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.badge.ok { color: var(--ok-text); background: var(--ok-soft); }
.badge.warn { color: var(--warn-text); background: var(--warn-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); }
.badge.mute { color: var(--muted); background: var(--surface-2); border-color: var(--line); }
.badge.acc { color: var(--audit); background: var(--audit-soft); } /* nivel 5S = color de auditoría (status-audit) */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
.kpi .v { font-size: var(--t-xl); font-weight: 750; line-height: 1.1; }
.kpi .l { font-size: var(--t-sm); color: var(--muted); font-weight: 600; margin-top: 6px; }
.notice { padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.notice.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn-text); }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.notice.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-text); }
.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 650; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.list { display: grid; gap: 12px; }
.list-item {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 12px 16px; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.list-item:hover { border-color: var(--accent); }
.list-item .code { font-weight: 700; color: var(--accent-strong); min-width: 52px; }
.list-item[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.hero { display: grid; gap: 16px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: var(--t-sm); }
.hero .who { font-size: var(--t-xl); font-weight: 750; letter-spacing: -.01em; }
.hero .who small { display: block; margin-top: 4px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); letter-spacing: 0; }
.login { max-width: 520px; margin: 0 auto; }
.gcard { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: start; }
.gfoto { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--faint); font-size: var(--t-xs); text-align: center; }
img.gfoto { display: block; }
.gcard h3 { margin: 0; font-size: var(--t-md); }
.gcard p { margin: 8px 0 0; overflow-wrap: anywhere; }
.gmeta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: var(--t-sm); margin-top: 8px; }
.gprev { display: grid; gap: 12px; }
.gprev img { max-width: 100%; max-height: 280px; border-radius: 12px; justify-self: start; }
.gform { display: grid; gap: 16px; }
.gform .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .gform .dos { grid-template-columns: 1fr; } }
.gfoto-grande { display: block; max-width: 100%; max-height: 70vh; border-radius: 12px; margin: 0 auto; }
.plantas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.planta-card {
  aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); color: var(--text); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font: inherit; cursor: pointer; padding: 12px; -webkit-tap-highlight-color: transparent;
}
.planta-card:hover, .planta-card:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.planta-card:active { transform: scale(.98); }
.planta-card b { font-size: clamp(2rem, 12vw, 3.5rem); line-height: 1; color: var(--accent-strong); letter-spacing: .02em; }
.planta-card span { color: var(--muted); font-size: var(--t-md); }
.pin { font-size: var(--t-xl); letter-spacing: .4em; text-align: center; }

/* ---------- auditoría ---------- */
.aud-head { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top)) 16px 12px; }
.aud-head .line1 { display: flex; align-items: center; gap: 16px; }
.aud-head .route { font-weight: 750; flex: 1; min-width: 0; }
.aud-head .route small { display: block; margin-top: 2px; color: var(--muted); font-weight: 600; font-size: var(--t-xs); }
.score { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.score .pts { font-size: var(--t-xl); font-weight: 800; line-height: 1; }
.score .pts small { font-size: var(--t-sm); color: var(--muted); font-weight: 600; }
.progress { flex: 1; min-width: 120px; }
.progress .bar { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }
.progress .txt { font-size: var(--t-xs); color: var(--muted); font-weight: 600; margin-top: 6px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0 0; }
.sec-title h2 { color: var(--accent-strong); }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 16px; }
.item .q { display: flex; gap: 16px; }
.item .n { flex: none; min-width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 750; font-size: var(--t-sm); }
.item.done .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 12px; }
.opt { min-width: 56px; min-height: 48px; padding: 0 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: var(--r-ctl); font: inherit; font-size: var(--t-lg); font-weight: 700; cursor: pointer; }
.opt[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt[aria-checked="true"].low { background: var(--warn-text); border-color: var(--warn-text); color: #fff; }
.opt .of { font-size: var(--t-xs); font-weight: 600; opacity: .75; }
.hall { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .hall { grid-template-columns: 1fr 1fr; } }
.footer-act { position: sticky; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.big { font-size: var(--t-2xl); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; padding-top: 20px; }
.scale .seg { text-align: center; padding: 10px 4px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 750; }
.scale .seg small { display: block; margin-top: 2px; font-weight: 600; color: var(--muted); font-size: var(--t-xs); }
.scale .seg.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale .seg.on small { color: inherit; opacity: .85; }
.scale .mark { position: absolute; top: 0; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid var(--text); transform: translateX(-7px); }
.sbars { display: grid; gap: 12px; }
.sbar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 12px; align-items: center; font-size: var(--t-sm); font-weight: 500; }
.sbar .bar { height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.sbar .bar i { display: block; height: 100%; background: var(--accent); }
.sbar b { text-align: right; }
.hallazgo { padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: grid; gap: 4px; }

tr.inactiva td { opacity: .55; }
.in.falta { border-color: var(--bad); background: var(--bad-soft); }
.periodo-ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.lobby-tbl table.compacta th.col-sem { min-width: 36px; padding: 3px 2px; }
.lobby-tbl table.compacta th.col-sem .sem-f, .lobby-tbl table.compacta th.col-sem .sem-hoy { display: none; }
.lobby-tbl table.compacta td.celda { padding: 0 2px; }
.lobby-tbl table.compacta .luz { min-width: 28px; font-size: calc(var(--rh, 24px) * .45); }
.kpis-ejec { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpis-ejec .v { font-size: 32px; }
.kpis-luz { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.luzkpi .v { display: flex; align-items: center; gap: 10px; }
.luzkpi .luz { width: 44px; min-width: 44px; height: 32px; font-size: 18px; }
.ejec-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.ejec-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.ch { position: relative; }
.ch svg { display: block; width: 100%; height: auto; overflow: visible; }
.ch svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.ch svg text.ch-dl { fill: var(--text); font-weight: 600; font-size: 13px; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-l1, .ch-l2 { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-l1 { stroke: var(--s1); } .ch-l2 { stroke: var(--s2); }
.ch-m1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; } .ch-m2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.ch-cross { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.ch-tip { position: absolute; z-index: 6; min-width: 190px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); box-shadow: var(--shadow-modal); font-size: 13px; pointer-events: none; display: grid; gap: 2px; }
.ch-tip[hidden] { display: none; }
.ch-tip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
.ch-tip .d1 { background: var(--s1); } .ch-tip .d2 { background: var(--s2); border-radius: 2px; }
.ch-leg { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.ch-sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid; position: relative; }
.ch-sw::after { content: ""; position: absolute; top: -6px; left: 6px; width: 10px; height: 10px; background: currentColor; border: 2px solid var(--surface); }
.ch-sw.s1 { border-color: var(--s1); color: var(--s1); } .ch-sw.s2 { border-color: var(--s2); color: var(--s2); }
.ch-sw.circulo::after { border-radius: 50%; } .ch-sw.cuadro::after { border-radius: 2px; }
.hb { display: grid; gap: 10px; }
.hb-row { display: grid; grid-template-columns: 110px 1fr 100px; gap: 10px; align-items: center; font-size: var(--t-sm); }
.hb-l { font-weight: 600; }
.hb-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hb-track i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hb-v { text-align: right; font-weight: 600; }
.hb-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--line); font-size: var(--t-lg); }
main.ancho { max-width: none; }
/* Lobby: la tabla se ajusta a la altura de la pantalla para que quepan todas las áreas sin desplazarse */
main.ancho { padding: 6px 12px 8px; }
.lobby.stack { gap: 6px; }
.lobby-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 20px; padding: 2px 4px; }
.lb-kpis { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 18px; font-size: var(--t-sm); color: var(--muted); }
.lb-k { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lb-k b { color: var(--text); font-size: var(--t-lg); font-weight: 700; }
.lb-prog { width: 90px; display: inline-block; }
.lb-prog .txt { display: none; }
.lobby-tbl { --rh: clamp(18px, calc((100dvh - 168px) / (var(--n, 36) + 1.6)), 54px); max-height: none; overflow-x: auto; overflow-y: auto; }
.lobby-tbl table { font-size: calc(var(--rh) * .5); line-height: 1.1; }
.lobby-tbl th, .lobby-tbl td { padding: 0 8px; border-bottom: 1px solid var(--line); height: var(--rh); }
.lobby-tbl th.col-area { position: sticky; left: 0; z-index: 3; background: var(--surface); width: 1%; min-width: 150px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: 0; font-size: clamp(11px, calc(var(--rh) * .52), 20px); font-weight: 600; color: var(--text); border-right: 1px solid var(--line); }
.lobby-tbl thead th { z-index: 4; height: auto; padding: 3px 6px; }
.lobby-tbl thead th.col-area { z-index: 5; background: var(--surface-2); color: var(--muted); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .04em; }
.lobby-tbl th.col-sem { text-align: center; min-width: 96px; white-space: nowrap; }
.lobby-tbl th.col-sem .sem-n { display: inline; color: var(--text); font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; }
.lobby-tbl th.col-sem .sem-f { display: inline; margin-left: 6px; font-weight: 500; font-size: 11px; }
.lobby-tbl th.col-sem .sem-hoy { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 10px; letter-spacing: .04em; }
.lobby-tbl th.col-sem.actual { background: var(--accent-soft); }
.lobby-tbl td.celda { text-align: center; padding: 0 6px; }
.lobby-tbl tbody tr:nth-child(odd) > * { background: #ffffff; }
.lobby-tbl tbody tr:nth-child(even) > * { background: #dde1ea; }
.lobby-tbl tbody tr:hover th.col-area, .lobby-tbl tbody tr:hover td { background: #c3cad8; }
.luz { display: inline-grid; place-items: center; min-width: 48px; width: 100%; max-width: 120px; height: calc(var(--rh, 24px) - 5px); border-radius: 6px; font-weight: 700; font-size: calc(var(--rh, 24px) * .55); line-height: 1; }
.luz.ok { background: var(--ok); color: #fff; }
.luz.warn { background: var(--warn); color: #1c1305; }
.luz.bad { background: var(--bad); color: #fff; }
.luz.mute { background: var(--surface-2); color: var(--faint); border: 1px dashed var(--line-strong); }
.leyenda { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: center; color: var(--muted); font-size: var(--t-xs); }
.ley { display: inline-flex; align-items: center; gap: 8px; }
.ley .luz { min-width: 26px; width: 26px; height: 18px; font-size: 12px; }
@media (max-width: 700px) { .lobby-tbl { --rh: 30px; } }
/* ---------- patrones de design.md ---------- */
/* Tarjeta de evento: indicador superior con el color del estado */
.card.ev { border-top: 4px solid var(--line-strong); border-radius: var(--r); }
.card.ev.ok { border-top-color: var(--ok); }
.card.ev.warn { border-top-color: var(--warn); }
.card.ev.bad { border-top-color: var(--bad); }
.card.ev.mute { border-top-color: var(--faint); }
/* Rango de fechas como badge destacado (equivale al rango horario 09:00 - 11:30) */
.rango { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--r-ctl); background: var(--accent-soft); color: var(--accent-strong); font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
/* Filtro segmentado con punto indicador de color */
.seg-filtro { display: inline-flex; flex-wrap: wrap; gap: 8px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }
.seg-filtro button { min-height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.seg-filtro button .pt { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--faint); flex: none; }
.seg-filtro button.ok .pt { border-color: var(--ok); } .seg-filtro button.warn .pt { border-color: var(--warn); } .seg-filtro button.bad .pt { border-color: var(--bad); }
.seg-filtro button[aria-pressed="true"] { background: var(--surface); border-color: var(--line-strong); color: var(--text); box-shadow: var(--shadow); }
.seg-filtro button[aria-pressed="true"] .pt { background: currentColor; }
.seg-filtro button[aria-pressed="true"].ok .pt { background: var(--ok); } .seg-filtro button[aria-pressed="true"].warn .pt { background: var(--warn); } .seg-filtro button[aria-pressed="true"].bad .pt { background: var(--bad); }
.seg-filtro button[aria-pressed="true"]:not(.ok):not(.warn):not(.bad) .pt { background: var(--muted); border-color: var(--muted); }
/* Ficha de solo lectura (equivale a "Host del evento") */
.ficha { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; display: grid; gap: 16px; }
.ficha .tag { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--t-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.ficha .tag svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ficha .quien { display: flex; align-items: center; gap: 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; font-size: var(--t-xs); flex: none; }
.ficha .quien b { display: block; font-weight: 600; margin-bottom: 2px; }
.ficha .quien span { color: var(--muted); font-size: var(--t-sm); }
.ficha .quien .avatar { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; text-align: center; line-height: 1; font-size: var(--t-xs); font-weight: 700; color: var(--accent-strong); font-variant-numeric: tabular-nums; }

/* ---------- diálogo / avisos ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-modal); padding: 24px; width: min(480px, 100%); display: grid; gap: 16px; max-height: 90vh; overflow: auto; }
.dialog .acts { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
#toasts { position: fixed; z-index: 120; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom)); display: grid; gap: 8px; justify-items: center; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 10px; max-width: 560px; font-weight: 600; }
.toast.bad { background: var(--bad); color: #fff; }
.pre { white-space: pre-wrap; word-break: break-word; font-size: var(--t-sm); }
.err-list { margin: 12px 0 0; padding-left: 20px; font-size: var(--t-sm); }
.pins td:last-child { font-family: ui-monospace, Consolas, monospace; font-size: var(--t-lg); font-weight: 700; letter-spacing: .15em; }

/* ---------- reporte e impresión ---------- */
.rep h1 { font-size: var(--t-lg); }
.rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; }
.rep-grid div span { display: block; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; }
.firma-img { max-width: 320px; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
/* ---------- Tema (diseño de referencia) ---------- */
body { font-family: var(--font); }
.top, .aud-head { background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: none; }
.top { min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); letter-spacing: 0; }
.brand .logo { height: 32px; width: auto; display: block; flex: none; }
.logo-grande { display: block; width: 180px; max-width: 60%; height: auto; margin: 8px auto 0; }
.logos-login { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 8px auto 0; }
.logos-login .logo-grande { margin: 0; width: 160px; max-width: 45%; }
.logos-login .logo-5s { width: 90px; max-width: 30%; height: auto; display: block; }
.brand .logo-5s { height: 32px; width: auto; display: block; flex: none; }
.brand-t { display: grid; gap: 4px; }
.brand-t small { font-size: 12px; font-weight: 600; line-height: 1.2; font-family: inherit; color: var(--audit); text-transform: none; letter-spacing: 0; margin: 0; display: block; }
.brand-t b { font-size: 16px; font-weight: 600; line-height: 1; color: var(--text); }
.chip-area, .pill { border: 0; background: var(--surface-2); border-radius: var(--r-ctl); }
.pill { font-family: inherit; font-size: 12px; }
.nav { background: var(--surface); border-top: 1px solid var(--line); box-shadow: none; }
.nav a { font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0; }
.nav a .ico { position: relative; display: inline-flex; }
.nav a .ico::after { content: ""; position: absolute; top: -2px; right: -5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity .15s; }
.nav a[aria-current="page"] { color: var(--accent-strong); }
.nav a[aria-current="page"] .ico::after { opacity: 1; }
@media (min-width: 900px) { .nav a[aria-current="page"] { background: var(--accent-soft); } .nav a { font-size: 13px; } }
h1 { font-weight: 700; letter-spacing: -.015em; }
.card, .kpi, .item, .tbl-wrap { border: 0; border-radius: var(--r); box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.tbl-wrap { overflow-x: auto; }
th { font-family: inherit; font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; background: var(--surface); }
.lobby-tbl th { font-size: 11px; }
td, .kpi .v, .res-v, .hb-v, .sbar b { font-variant-numeric: tabular-nums; }
.kpi .l { font-family: inherit; font-size: 12px; font-weight: 500; }
/* tarjeta de evento con barra lateral de color */
.card.ev { position: relative; overflow: hidden; border-top: 0; padding-left: 22px; transition: box-shadow .15s; }
.card.ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--audit); }
.card.ev.ok::before { background: var(--ok); }
.card.ev.warn::before { background: var(--warn); }
.card.ev.bad::before { background: var(--accent); }
.card.ev.mute::before { background: var(--audit); }
/* banner de semana en curso */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; color: #fff; background: var(--accent-strong); }
.banner .live { position: relative; display: inline-flex; width: 10px; height: 10px; flex: none; }
.banner .live i { position: absolute; inset: 0; border-radius: 50%; background: #fff; opacity: .75; }
.banner .live b { position: relative; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
@keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
.banner-t { font-size: 13px; font-weight: 700; line-height: 1.2; font-family: inherit; text-transform: none; letter-spacing: 0; }
.banner-s { font-size: 12px; opacity: .92; margin-top: 6px; }
.banner-r { font-size: 12px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; background: rgba(255, 255, 255, .2); padding: 4px 10px; border-radius: var(--r-ctl); white-space: nowrap; }
/* botones */
.btn { border: 1px solid transparent; background: var(--surface-2); color: var(--btn-text); border-radius: var(--r-ctl); transition: transform .12s, background-color .12s, box-shadow .12s; }
.btn:hover { background: var(--surface-4); border-color: transparent; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.primary:hover { background: var(--accent-hover); border-color: transparent; transform: none; box-shadow: none; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: var(--on-bad); }
.btn.ghost { background: transparent; color: var(--accent-strong); }
.btn.ghost:hover { background: var(--accent-soft); }
.in, select.in, textarea.in { background: var(--surface-3); border: 1px solid transparent; border-radius: var(--r-ctl); }
.in:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); outline: none; }
.in.falta { border-color: var(--bad); background: var(--bad-soft); }
/* etiquetas y filtros */
.badge { border-radius: var(--r-pill); font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: none; padding: 4px 12px; }
.badge.mute { background: var(--surface-4); color: var(--text); border-color: transparent; }
.badge.bad { color: var(--bad); }
.rango { font-family: inherit; border-radius: var(--r-ctl); background: var(--surface-2); color: var(--text); text-transform: none; }
.seg-filtro { background: transparent; border: 0; padding: 0; gap: 6px; }
.seg-filtro button { background: var(--surface); color: var(--muted); border-radius: var(--r-pill); box-shadow: none; border-color: var(--line); font-family: inherit; font-size: 12px; font-weight: 600; }
.seg-filtro button[aria-pressed="true"] { background: var(--inverse); color: var(--inverse-ink); border-color: transparent; box-shadow: var(--shadow); }
.seg-filtro button[aria-pressed="true"] .pt { background: currentColor; border-color: currentColor; }
.tabs button[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); }
.list-item { border: 0; border-radius: 12px; box-shadow: var(--shadow); }
.list-item:hover { box-shadow: none; outline: 1px solid var(--accent); }
.list-item[aria-pressed="true"] { background: var(--accent-soft); }
.opt { border-color: var(--line-strong); }
.opt[aria-checked="true"].low { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
.item.done .n { background: var(--accent); border-color: var(--accent); color: #fff; }
.scale .seg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.notice { border-radius: 12px; }
.sec-title h2 { color: var(--accent-strong); }
/* resultado: nivel grande + calificación chica */
.res { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.res-n { font-size: 1.15em; font-weight: 800; color: var(--audit); letter-spacing: -.01em; }
.res-v { font-size: 12px; font-weight: 500; font-family: inherit; font-variant-numeric: tabular-nums; color: var(--muted); }
.hb-total .res-n { font-size: 1.3em; }
.ch svg rect.ap-c, .ch-leg .mes-sw.ap-c { fill: var(--s1); background: var(--s1); }
.ch svg rect.ap-k, .ch-leg .mes-sw.ap-k { fill: var(--s2); background: var(--s2); }
.ch-leg .mes-sw { display: inline-block; width: 22px; height: 12px; border-radius: 2px; background: var(--s1); margin-right: 8px; vertical-align: -1px; }
table.zebra tbody tr:nth-child(even) td { background: var(--surface-2); }
table.zebra tbody tr.tot td { background: var(--accent-soft); border-top: 2px solid var(--line-strong); }
.ch-umbral { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 4; }
.ch svg text.ch-nv { fill: var(--faint); font-size: 11px; font-family: var(--mono); font-weight: 600; }
.ch svg text.ch-eje { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
/* semáforos */
.luz.ok { background: var(--ok); color: var(--on-ok); }
.luz.warn { background: var(--warn); color: var(--on-warn); }
.luz.bad { background: var(--bad); color: var(--on-bad); }
.lobby-tbl th.col-sem .sem-hoy { background: var(--accent); color: #fff; }
.lobby-tbl th.col-sem.actual { background: var(--accent-soft); }
.pill .dot { background: var(--ok); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media print {
  :root {
    --bg: #fff; --surface: #fff; --surface-2: #f3f3f3; --line: #bbb; --line-strong: #888; --text: #000; --muted: #444;
    --accent: #000; --accent-strong: #000; --accent-ink: #fff; --accent-soft: #eee; --ok: #000; --ok-soft: #fff; --warn: #000; --warn-soft: #fff; --bad: #000; --bad-soft: #fff; --shadow: none;
  }
  .top, .nav, .noprint, #toasts, .aud-head, .footer-act { display: none !important; }
  .shell { display: block; padding: 0; }
  main { max-width: none; padding: 0; }
  .card { border: 0; padding: 0; box-shadow: none; }
  tr { break-inside: avoid; }
  .badge { border: 1px solid #000; }
}
@media (max-width: 480px) {
  .sbar { grid-template-columns: 84px 1fr 60px; }
  .chip-area { max-width: 40vw; }
  .brand small { display: none; }
}
/* íconos dentro de botones y enlaces-botón: tamaño fijo (un SVG sin tamaño se desbordaba) */
.btn svg, button svg, a.btn svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* Botón de cambiar de área: el nombre se ve completo (ajusta a varias líneas en vez de recortarse) */
.top { flex-wrap: wrap; row-gap: 8px; }
.chip-area { max-width: min(60vw, 460px); height: auto; min-height: 48px; padding: 8px 16px; text-align: left; flex: 0 1 auto; min-width: 0; }
.chip-area span { overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; line-height: 1.2; }
.chip-area svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) {
  .chip-area { order: 3; flex: 1 1 100%; max-width: none; justify-content: space-between; }
}
/* calificación recibida junto al semáforo del lobby */
.celda-in { display: inline-grid; grid-template-columns: 48px calc(var(--rh, 24px) * 2.6); align-items: center; justify-items: start; gap: 8px; }
.celda-in > .luz { justify-self: stretch; width: auto; }
.lobby-tbl table.compacta .celda-in { display: inline-flex; justify-content: center; }
.lobby-tbl td.celda .luz { width: auto; min-width: 40px; }
.lobby-tbl td.celda .res { font-size: calc(var(--rh, 24px) * .5); }
.lobby-tbl table:not(.compacta) th.col-sem { min-width: 150px; }
.lobby-tbl th.col-rec, .lobby-tbl td.col-rec { text-align: center; border-left: 1px solid var(--line); background: var(--surface-3); white-space: nowrap; }
.lobby-tbl thead th.col-rec { background: var(--surface-2); }
.lobby-tbl th.col-rec .sem-f { margin-left: 6px; }
/* Agregar áreas: una fila por área con espacio entre el nombre y el checklist */
.fila-area { display: grid; grid-template-columns: 36px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 4px 0; }
.fila-area .n { width: 36px; height: 36px; border-radius: var(--r-ctl); background: var(--surface-2); display: grid; place-items: center; font: 600 12px var(--mono); color: var(--muted); }
@media (max-width: 700px) {
  .fila-area { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fila-area select { grid-column: 2 / 4; grid-row: 2; }
}
/* Filtros de estatus y periodo: pastillas con aire entre sí */
.row.controles { gap: 16px 28px; align-items: flex-end; }
.row.controles .f { gap: 12px; }
.seg-filtro { gap: 10px; }
.seg-filtro button { padding: 0 16px; gap: 10px; min-height: 44px; }
.periodo-ctl { gap: 12px 20px; }
@media (max-width: 600px) { .row.controles > * { flex: 1 1 100%; } .seg-filtro { gap: 10px 8px; } .seg-filtro button { padding: 0 14px; } }
/* Filtro de periodo: posición fija de los botones aunque cambie la opción elegida */
.periodo-ctl { flex-wrap: nowrap; }
.periodo-ctl .seg-filtro { flex: none; flex-wrap: nowrap; }
.periodo-ctl .periodo-valor { display: flex; align-items: center; gap: 8px; flex: none; }
.periodo-ctl .periodo-valor select.in { width: 250px; min-width: 250px; max-width: 250px; }
@media (max-width: 900px) {
  .periodo-ctl { flex-wrap: wrap; }
  .periodo-ctl .periodo-valor select.in { width: min(250px, 52vw); min-width: 0; max-width: none; }
}
/* Barra superior de los dashboards: SIEMPRE una sola fila (marca | periodo | acciones). Si falta espacio, los elementos
   se compactan (sin etiquetas, controles más angostos) y, como último recurso, el periodo se desplaza dentro de su espacio. */
html { overflow-y: scroll; scrollbar-gutter: stable; }
.shell { grid-template-columns: minmax(0, 1fr); }  /* sin esto, una tabla ancha estira toda la página */
@media (min-width: 900px) { .shell { grid-template-columns: 190px minmax(0, 1fr); } .shell.solo { grid-template-columns: minmax(0, 1fr); } }
main { min-width: 0; }

// Tiempo de captura (dato solo del administrador): segundos de actividad real; las pausas largas no cuentan
function tocarCron(rec) {
  const ahoraT = Date.now();
  if (S.cron && S.cron.id === rec.id) rec.seg = (rec.seg || 0) + Math.min(ahoraT - S.cron.t, 120000) / 1000;
  S.cron = { id: rec.id, t: ahoraT };
}
const pendientes = () => (S.area ? recsDeArea(S.area).filter((r) => r.pend) : []);
const PFXG = 'a5s.g.';
function cargarGemba() {
  GEMBA.clear();
  for (const k of kv.keys(PFXG)) { const g = kv.get(k); if (g && g.id) GEMBA.set(g.id, g); }
}
const duenoGemba = () => S.area || (S.rol === 'admin' ? 'admin' : 'publico'); // sin sesión (desde el login): "publico"
const gembaPend = () => [...GEMBA.values()].filter((g) => g.dueno === duenoGemba());
// lo que se puede enviar ahora: lo de la sesión actual y lo registrado sin sesión

/* =====================================================================
   Red y sincronización
   ===================================================================== */
async function api(method, url, body, opts = {}) {
  const headers = {};
  if (body !== undefined) headers['content-type'] = 'application/json';
  if (S.token) headers.authorization = `Bearer ${S.token}`;
  let r;
  try {
    r = await fetch(url.startsWith('/api') ? `/${S.planta}${url}` : url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' });
  } catch (e) {
    setOnline(false);
    const err = new Error('Sin conexión con el servidor.'); err.red = true; throw err;
  }
  setOnline(true);
  const ct = r.headers.get('content-type') || '';
  const j = ct.includes('json') ? await r.json().catch(() => null) : null;
  if (r.status === 401 && S.token && !opts.sinRedireccion) sesionVencida();
  if (!r.ok) { const err = new Error((j && j.error) || `Error ${r.status}`); err.status = r.status; err.json = j; throw err; }
  return opts.blob ? r.blob() : j;
}
function setOnline(v) { if (S.online !== v) { S.online = v; pintarPill(); if (v) sync(); } }
window.addEventListener('online', () => { S.online = true; pintarPill(); S.fallos = 0; S.proximoIntento = 0; sync(); });
window.addEventListener('offline', () => { S.online = false; pintarPill(); });

function sesionVencida() {
  if (S.sesionVencida) return;
  S.sesionVencida = true;
  const area = S.area;
  S.token = null; S.rol = null; S.area = null;
  kv.del('a5s.session');
  S.ultimaArea = area || S.ultimaArea;
  toast('Tu sesión venció. Inicia sesión de nuevo; tus capturas locales se conservan.', 'bad');
  irA('#/login');
}

let syncTimer = null;
function pedirSync(ms = 1500) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }

async function sync() {
  if (S.syncing || S.rol === 'lobby' || !S.planta) return;
  if (!S.token) { try { await empujarGemba(); } catch (e) { /* sin red: se reintenta */ } pintarPill(); return; } // hallazgos registrados desde el login
  if (Date.now() < S.proximoIntento) { pedirSync(S.proximoIntento - Date.now() + 50); return; }
  S.syncing = true; pintarPill();
  try {
    if (S.rol === 'area') await empujar();
    await empujarGemba();
    await traer();
    S.fallos = 0; S.proximoIntento = 0; S.ultimaSync = Date.now();
    kv.set('a5s.ultimaSync', S.ultimaSync);
  } catch (e) {
    if (e.red) {
      S.fallos += 1;
      const espera = Math.min(60000, 2000 * 2 ** Math.min(S.fallos, 5));
      S.proximoIntento = Date.now() + espera;
      pedirSync(espera);
    } else if (e.status !== 401) {
      S.fallos += 1; S.proximoIntento = Date.now() + 15000; pedirSync(15000);
    }
  } finally {
    S.syncing = false; pintarPill(); refrescarVista();
  }
}

async function empujar() {
  const lista = pendientes().filter((r) => !r.errSync).sort((a, b) => (a.estado === 'final' ? 0 : 1) - (b.estado === 'final' ? 0 : 1) || a.semana - b.semana);
  for (const r of lista) {
    const marca = r.mod;
    try {
      const sr = await api('PUT', `/api/auditorias/${r.id}`, aServidor(r));
      if (r.mod !== marca) { r.pend = true; putRec(r); continue; } // se editó mientras se enviaba
      putRec(deServidor(sr, r));
    } catch (e) {
      if (e.red || e.status === 401) throw e;
      if (e.status === 409 && e.json && e.json.auditoria) {
        const previa = r;
        putRec(deServidor(e.json.auditoria, null));
        if (!e.json.mismo_dispositivo) {
          const a = e.json.auditoria;
          avisar(`La auditoría ${r.id} (${nombreArea(r.auditada)}) ya la finalizó otro equipo${a.persona_audita ? ` (${a.persona_audita})` : ''} el ${a.terminado ? fmtHora(a.terminado) : ''}. Se conservó la primera; tu captura de este equipo no se guardó.`);
          kv.set(`a5s.descartada.${previa.id}`, previa);
        }
      } else {
        r.errSync = e.message; putRec(r);
      }
    }
  }
}

async function empujarGemba() {
  for (const g of gembaPorEnviar().filter((x) => !x.errSync)) {
    try {
      await api('PUT', `/api/gemba/${g.id}`, { registrante: g.registrante, fecha: g.fecha, area: g.area, lugar: g.lugar, observacion: g.observacion, dirigido: g.dirigido, foto: g.foto, creado: g.creado, dispositivo: g.dispositivo });
      GEMBA.delete(g.id); kv.del(PFXG + g.id);
    } catch (e) {
      if (e.red || e.status === 401) throw e;
      g.errSync = e.message; kv.set(PFXG + g.id, g);
    }
  }
}

async function traer() {
  const res = await api('GET', '/api/config');
  S.skew = Date.parse(res.ahora) - Date.now();
  kv.set('a5s.skew', S.skew);
  kv.set('a5s.cfg', res.config);
  setCfg(res.config);
  if (S.rol !== 'area') return;
  const lista = await api('GET', `/api/auditorias?area=${encodeURIComponent(S.area)}`);
  for (const s of lista) {
    if (s.auditora !== S.area) continue;
    const loc = getRec(s.id);
    if (loc && loc.pend) continue;
    if (loc && loc.estado === s.estado && loc.terminado === s.terminado && s.estado === 'final') continue;
    const det = await api('GET', `/api/auditorias/${s.id}`);
    putRec(deServidor(det, loc));
  }
  api('GET', '/api/tablero').then((t) => kv.set('a5s.tab.acum', { t, at: Date.now() })).catch(() => {});
}

function avisar(texto) {
  const l = kv.get('a5s.avisos') || [];
  l.push({ id: Date.now(), texto });
  kv.set('a5s.avisos', l);
}

/* =====================================================================
   Interfaz base: toasts, diálogos, encabezado, navegación
   ===================================================================== */
function toast(msg, tipo) {
  const t = h('div', { class: `toast ${tipo || ''}` }, msg);
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'bad' ? 7000 : 3500);
}
function $(id) { return document.getElementById(id); }

function dialogo({ titulo, cuerpo, acciones, ancho }) {
  return new Promise((resolve) => {
    const previo = document.activeElement;
    const cerrar = (v) => { ov.remove(); document.removeEventListener('keydown', tecla); if (previo && previo.focus) previo.focus(); resolve(v); };
    const tecla = (e) => { if (e.key === 'Escape') cerrar(null); };
    const botones = acciones.map((a) => h('button', { class: `btn ${a.clase || ''}`, type: 'button', onclick: () => cerrar(a.valor) }, a.texto));
    const ov = h('div', { class: 'overlay', onclick: (e) => { if (e.target === ov) cerrar(null); } },
      h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo, style: ancho ? `width:min(${ancho}, 100%)` : null },
        h('h2', {}, titulo), h('div', { class: 'stack-s' }, cuerpo), h('div', { class: 'acts' }, botones)));
    document.body.appendChild(ov);
    document.addEventListener('keydown', tecla);
    (botones[botones.length - 1]).focus();
  });
}
const confirmar = (titulo, texto, ok, claseOk) => dialogo({
  titulo, cuerpo: typeof texto === 'string' ? h('p', {}, texto) : texto,
  acciones: [{ texto: 'Cancelar', valor: false }, { texto: ok, valor: true, clase: claseOk || 'primary' }],
});

function textoPill() {
  const n = pendientes().length + gembaPend().length;
  if (!S.online) return { c: 'off', t: n ? `Sin conexión · ${n} pendiente${n === 1 ? '' : 's'}` : 'Sin conexión' };
  if (S.syncing) return { c: 'busy pend', t: n ? `Sincronizando ${n}…` : 'Sincronizando…' };
  if (n) return { c: 'pend', t: `${n} pendiente${n === 1 ? '' : 's'}` };
  return { c: '', t: 'Sincronizado' };
}
function pintarPill() {
  const el = document.querySelector('.pill[data-sync]');
  if (!el) return;
  const p = textoPill();
  el.className = `pill ${p.c}`;
  el.lastChild.textContent = p.t;
}

const marca = (sub) => h('div', { class: 'brand' }, h('img', { class: 'logo', src: '/danfoss.svg', alt: 'Danfoss' }), h('img', { class: 'logo-5s', src: '/5s.png', alt: '5S' }), h('span', { class: 'brand-t' }, h('small', {}, sub || 'Calidad · 5S'), h('b', {}, 'Auditorías')));

async function cambiarArea() {

function navegacion(actual) {

/* =====================================================================
   Router
   ===================================================================== */
function ruta() {
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  return { vista: parts[0] || '', param: decodeURIComponent(parts[1] || '') };
}
let limpiezaVista = null;
// Navega a un hash; si ya estamos ahí, solo repinta (evita doble render por hashchange)
function irA(destino) { if (location.hash === destino) render(); else location.hash = destino; }
function refrescarVista() {
  const { vista } = ruta();
  // no se vuelve a pintar mientras se captura una auditoría o el resumen
  // solo Inicio se repinta solo; el resto tiene estado transitorio (PIN recién generados, mensajes, filtros)
  if (vista !== 'inicio') return;
  if (document.querySelector('.overlay')) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
  render();
}
async function render() {
  const id = ++S.renderId;
  const { vista, param } = ruta();
  if (limpiezaVista) { try { limpiezaVista(); } catch (e) { /* nada */ } limpiezaVista = null; }
  let nav = null, contenido, solo = false;
  if (!S.planta) {
    contenido = vistaPlanta();
    solo = true;
  } else if (!S.token && vista === 'gemba' && param === 'nuevo') {
    contenido = vistaGembaNuevo();
    solo = true;
  } else if (!S.token) {
    contenido = vistaLogin();
    solo = true;
  } else if (S.rol === 'lobby' && vista !== 'lobby' && vista !== 'ejecutivo' && vista !== 'mensual') {
    irA('#/lobby'); return;
  } else if (vista === 'lobby' && (S.rol === 'lobby' || S.rol === 'admin')) {
    contenido = vistaLobby(); solo = true;
  } else if (vista === 'ejecutivo' && (S.rol === 'lobby' || S.rol === 'admin')) {
    contenido = vistaEjecutivo(); solo = true;
  } else if (vista === 'mensual' && (S.rol === 'lobby' || S.rol === 'admin')) {
    contenido = vistaMensual(); solo = true;
  } else if (S.rol === 'admin' && !['admin', 'tablero', 'datos', 'gemba'].includes(vista)) {
    location.hash = '#/admin'; return;
  } else if (S.rol === 'area' && !['inicio', 'tablero', 'gemba', 'audit', 'resumen', 'reporte'].includes(vista)) {
    location.hash = '#/inicio'; return;
  } else if (vista === 'audit') { contenido = vistaAudit(param); solo = true; }
  else if (vista === 'resumen') { contenido = vistaResumen(param); solo = true; }
  else if (vista === 'reporte') { contenido = vistaReporte(param); solo = true; }
  else {
    nav = navegacion(vista);
    contenido = vista === 'tablero' ? vistaTablero(id) : vista === 'gemba' ? vistaGemba(param) : vista === 'datos' ? vistaDatos() : vista === 'admin' ? vistaAdmin() : vistaInicio();
  }
  if (id !== S.renderId) return;
  const pantalla = vista === 'lobby' && S.rol !== 'area';
  document.documentElement.classList.toggle('pantalla', pantalla);
  $('app').replaceChildren(h('div', { class: `shell ${solo ? 'solo' : ''}${pantalla ? ' pantalla' : ''}` },
    contenido._cabecera || cabecera(), h('main', { id: 'main', class: (vista === 'lobby' || vista === 'ejecutivo' || vista === 'mensual') && S.rol !== 'area' ? 'ancho' : '' }, contenido), nav));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* =====================================================================
   Planta (antes del acceso)
   ===================================================================== */
const nombrePlanta = (id) => { const p = PLANTAS.find((x) => x.id === id); return p ? p.nombre : ''; };
// Cada planta tiene su propia base de datos, sesión y capturas locales: al elegirla se carga lo suyo.
function cargarPlanta() {
  S.token = null; S.rol = null; S.area = null; S.cfg = null; S.X = null; S.ultimaSync = null; S.ultimaArea = null; S.cron = null;
  RECS.clear(); GEMBA.clear();
  if (!S.planta) return;
  S.skew = kv.get('a5s.skew') || 0;
  S.ultimaSync = kv.get('a5s.ultimaSync');
  cargarRecs();
  cargarGemba();
  const cfg = kv.get('a5s.cfg');
  if (cfg) { try { setCfg(cfg); } catch (e) { kv.del('a5s.cfg'); } }
  const ses = kv.get('a5s.session');
  if (ses && ses.token) { S.token = ses.token; S.rol = ses.rol; S.area = ses.area; }
}
const inicioDe = () => (S.token ? (S.rol === 'admin' ? '#/admin' : S.rol === 'lobby' ? '#/lobby' : '#/inicio') : '#/login');
function elegirPlanta(id) {

  irA(inicioDe());
  if (S.token) sync();
}

      kv.set('a5s.session', { token: r.token, rol: r.rol, area: r.area || null });

        h('button', { class: 'btn ghost', type: 'button', onclick: () => { modoLobby = false; aviso.replaceChildren(); pintar(); } }, 'Volver a elegir área'));
      pass.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar({ lobby: true, password: pass.value }); });
      setTimeout(() => pass.focus(), 50);

    if (seleccion) {
      const pin = h('input', { class: 'in pin', type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '6', autocomplete: 'one-time-code', 'aria-label': 'PIN de 4 a 6 dígitos', placeholder: '••••' });
      cuerpo.append(

}

function descargar(nombre, blob) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: nombre });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
// Libro .xlsx mínimo (una hoja, todo texto para conservar ceros a la izquierda) sin dependencias: zip sin compresión.
function xlsxBlob(filas, hoja) {
  const enc = new TextEncoder();
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const col = (i) => String.fromCharCode(65 + i);
  const filasXml = filas.map((f, r) => `<row r="${r + 1}">${f.map((v, c) => `<c r="${col(c)}${r + 1}" t="inlineStr"${r === 0 ? ' s="1"' : ''}><is><t>${esc(v)}</t></is></c>`).join('')}</row>`).join('');
  const ancho = filas[0].map((_, c) => Math.min(60, Math.max(8, ...filas.map((f) => String(f[c]).length)) + 2));
  const archivos = {
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(hoja)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': '<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>',
    'xl/worksheets/sheet1.xml': `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${ancho.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${filasXml}</sheetData></worksheet>`,
  };
  const tabla = new Uint32Array(256).map((_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
  const crc = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = tabla[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const partes = [], central = [];
  let pos = 0;
  for (const [nombre, texto] of Object.entries(archivos)) {
    const n = enc.encode(nombre), d = enc.encode(texto), c = crc(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint32(14, c, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, n.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, c, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, n.length, true); ch.setUint32(42, pos, true);
    partes.push(new Uint8Array(lh.buffer), n, d); central.push(new Uint8Array(ch.buffer), n);
    pos += 30 + n.length + d.length;
  }
  const tamC = central.reduce((s, p) => s + p.length, 0);
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, Object.keys(archivos).length, true); fin.setUint16(10, Object.keys(archivos).length, true); fin.setUint32(12, tamC, true); fin.setUint32(16, pos, true);
  return new Blob([...partes, ...central, new Uint8Array(fin.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function importarRespaldo(texto) {
  let j;
  try { j = JSON.parse(texto); } catch (e) { throw new Error('El archivo no es un JSON válido.'); }
  if (!j || j.tipo !== 'a5s-respaldo-1' || !Array.isArray(j.auditorias)) throw new Error('El archivo no es un respaldo de Auditorías 5S (falta "tipo": "a5s-respaldo-1").');
  let nuevas = 0, actualizadas = 0, omitidas = 0;
  for (const r of j.auditorias) {
    if (!r || !parseAuditId(r.id) || !r.auditora || !r.auditada || !r.checklist || typeof r.respuestas !== 'object' || r.respuestas === null || !['borrador', 'final'].includes(r.estado)) { omitidas += 1; continue; }
    const loc = getRec(r.id);
    if (!loc) { putRec({ ...r, pend: true, mod: Date.now(), errSync: undefined }); nuevas += 1; }
    else if (loc.estado === 'borrador' && r.estado === 'final') { putRec({ ...r, pend: true, mod: Date.now(), errSync: undefined }); actualizadas += 1; }
    else omitidas += 1;
  }
  return { nuevas, actualizadas, omitidas };
}
